name: Release

# release-please cuts a release from Conventional Commits on main; goreleaser then attaches a binary for
# every platform to it. There is nothing to deploy: users install the binary on their own machines.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-binaries:
    name: Release Binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          path: dfm-mcp
      - uses: actions/setup-go@v7
        with:
          go-version-file: dfm-mcp/go.mod
          cache-dependency-path: dfm-mcp/go.sum
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
          workdir: dfm-mcp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
